scalar DateTime

type Poll {
  id: ID!
  question: String!
  author: Author!
  isActive: Boolean!
  isAutoGenerated: Boolean!
  closesAt: DateTime
  totalVotes: Int!
  viewerChoiceId: ID
  createdAt: DateTime!
  updatedAt: DateTime!
  choices: [Choice!]!
  comments: [Comment!]!
  topComments: [Comment!]!
}

type Choice {
  id: ID!
  poll: Poll!
  choiceText: String!
  votes: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input ChoiceFilter {
  pollId: ID
}

input PollFilter {
  question: String
  isActive: Boolean
}

type PollConnection {
  nodes: [Poll!]!
  total: Int!
  limit: Int!
  page: Int!
}

type Author {
  id: ID!
  name: String!
  email: String!
  comments: [Comment!]!
}

type User {
  id: ID!
  username: String!
  email: String!
  author: Author
}

type Comment {
  id: ID!
  poll: Poll!
  author: Author
  authorName: String!
  content: String!
  likes: Int!
  viewerLiked: Boolean!
  createdAt: DateTime!
}

type Query {
  polls(filter: PollFilter, limit: Int = 20, page: Int = 1): PollConnection!
  choices(filter: ChoiceFilter): [Choice!]!
  poll(id: ID!): Poll
  choice(id: ID!): Choice
  author(id: ID!): Author
  me: User
}

type Mutation {
  login(username: String!, password: String!): User!
  logout: Boolean!
  vote(pollId: ID!, choiceId: ID!): Poll!
  createPoll(
    question: String!
    pubDate: DateTime!
    authorId: ID!
    choices: [String!]
  ): Poll!
  createChoice(pollId: ID!, choiceText: String!): Choice!
  createComment(
    pollId: ID!
    content: String!
    authorName: String
  ): Comment!
  toggleCommentLike(commentId: ID!): Comment!
  createAuthor(name: String!, email: String!): Author!
}
